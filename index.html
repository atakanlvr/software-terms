<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Terim Defteri">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Yazılım Terim Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single study column; home = modules as foldable sections, term page = definition → flow → test */
:root{
  --bg:#EDF0F5; --card:#FFFFFF; --ink:#172033; --muted:#5A6479; --line:#D6DCE6;
  --accent:#2B46C2; --accent-soft:#E2E7FA; --on-accent:#FFFFFF;
  --code-bg:#F5F7FB; --str:#8A4A00;
  --ok:#1C7347; --ok-bg:#E1F3E8; --ok-line:#86C8A2;
  --bad:#B02A20; --bad-bg:#FBE5E2; --bad-line:#E9A099;
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161F; --card:#19202D; --ink:#E6EAF2; --muted:#9AA3B6; --line:#2B3446;
  --accent:#93A6FF; --accent-soft:#232D4F; --on-accent:#0E1430;
  --code-bg:#141A25; --str:#F0B46A;
  --ok:#7DD3A2; --ok-bg:#15301F; --ok-line:#2E6A47;
  --bad:#FF9B92; --bad-bg:#371B1A; --bad-line:#7A3530;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161F; --card:#19202D; --ink:#E6EAF2; --muted:#9AA3B6; --line:#2B3446;
  --accent:#93A6FF; --accent-soft:#232D4F; --on-accent:#0E1430;
  --code-bg:#141A25; --str:#F0B46A;
  --ok:#7DD3A2; --ok-bg:#15301F; --ok-line:#2E6A47;
  --bad:#FF9B92; --bad-bg:#371B1A; --bad-line:#7A3530;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{max-width:800px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,50px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;margin:0}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.02em}
.lead{color:var(--muted);margin-top:12px;max-width:62ch}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:20px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:24px}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0}
.ct{font-weight:600;font-size:18px}
.cs{color:var(--muted);font-size:15px;margin-top:2px}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px var(--f-body);cursor:pointer;align-self:flex-start}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mods{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mod>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 14px;padding:16px 18px;cursor:pointer}
.mod>summary::-webkit-details-marker{display:none}
.mn{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.mt{font-weight:600;font-size:19px;line-height:1.3}
.mr{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.mr svg{transition:transform .2s}
.mod[open] .mr svg{transform:rotate(180deg)}
.mbar{grid-column:1/-1;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.mbar>i{display:block;height:100%;background:var(--ok)}
.mod.full .mt::after{content:" ✓";color:var(--ok)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:13px 18px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;min-height:60px;cursor:pointer}
.row .n{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .nm{display:block;font-weight:600;font-size:17px;line-height:1.3}
.row .en{display:block;font-size:14px;color:var(--muted)}
.chip{font-size:13px;line-height:1;padding:7px 11px;border-radius:99px;white-space:nowrap;font-weight:500;background:var(--ok-bg);color:var(--ok)}
.go{color:var(--muted);display:flex}
.back{background:none;border:0;padding:8px 0;min-height:44px;color:var(--accent);font:500 16px var(--f-body);cursor:pointer;margin-bottom:10px}
.def{margin-top:22px;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.lbl{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-bottom:8px}
.big{font-size:clamp(20px,2.8vw,25px);line-height:1.45;font-weight:500;text-wrap:pretty}
.analogy{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted)}
.analogy b{color:var(--ink);font-weight:600}
.sec{margin-top:36px}
.sec>p{margin-top:8px}
.code{margin:14px 0 0;padding:16px 18px;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;overflow-x:auto;font-family:var(--f-mono);font-size:14.5px;line-height:1.8;white-space:pre;color:var(--ink)}
.code .k{color:var(--accent);font-weight:500}
.code .s{color:var(--str)}
.code .c{color:var(--muted);font-style:italic}
.note{margin-top:14px;color:var(--muted)}
.testhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.score{font-family:var(--f-mono);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:15px}
.q{padding:22px 0 4px}
.q+.q{border-top:1px solid var(--line);margin-top:14px}
.tag{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);margin-bottom:6px}
.qt{font-weight:600;font-size:18px;line-height:1.45;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) 20px;align-items:start;gap:12px;width:100%;min-height:56px;padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:400 17px/1.45 var(--f-body);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt .l{font-family:var(--f-mono);font-size:15px;color:var(--muted);padding-top:1px}
.opt .mk{display:flex;align-items:center;height:24px}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.right{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:500}
.opt.wrong .l{color:var(--bad)} .opt.right .l{color:var(--ok)}
.q.solved .opt:not(.right):not(.wrong){color:var(--muted);cursor:default}
@media (hover:hover){.q:not(.solved) .opt:not(.wrong):hover{border-color:var(--accent)}}
.opt.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.exp{margin-top:12px;color:var(--muted)}
.exp b{color:var(--ink);font-weight:600}
.donebox{margin-top:24px;padding:20px;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:14px;color:var(--ok)}
.dt{font-family:var(--f-display);font-weight:700;font-size:24px}
.ds{margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.pager button{background:none;border:0;color:var(--accent);font:500 16px var(--f-body);cursor:pointer;min-height:44px;padding:0;text-align:left;max-width:48%}
.pager button:last-child{text-align:right;margin-left:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.opt.shake{animation:none}.mr svg{transition:none}}
</style>
</head>
<body>
<main id="app" class="wrap" lang="tr">
  <p class="eyebrow">168 terim</p>
  <h1>Yazılım Terim Defteri</h1>
</main>
<p id="live" class="sr" aria-live="polite"></p>
<script src="terms.js"></script>
<script>
const KEY='terim-defteri-v1';
const TERMS=[];
MODULES.sort((a,b)=>a.no-b.no).forEach(m=>{m.terms.sort((a,b)=>a.no-b.no);m.terms.forEach(t=>{t.m=m;TERMS.push(t);});});
const TOTAL=TERMS.length;
const byNo=n=>TERMS.find(t=>t.no===n);

let state={done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)state=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const app=document.getElementById('app');
const live=document.getElementById('live');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const say=m=>{live.textContent='';setTimeout(()=>{live.textContent=m;},40);};
const isDone=t=>!!state.done[t.no];
const doneCount=()=>TERMS.filter(isDone).length;
const nextTodo=()=>TERMS.find(t=>!isDone(t));
const ICON_OK='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="sr">Doğru</span>';
const ICON_BAD='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg><span class="sr">Yanlış</span>';
const CHEV='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const ARROW='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const KW=/\b(START|END IF|END FOR|END WHILE|END TRY|END FUNCTION|END|IF|THEN|ELSE IF|ELSE|FOR EACH|FOR|WHILE|REPEAT|UNTIL|RETURN|FUNCTION|CALL|GET|FROM|SHOW|ON|LOAD|STORE|IN|SET|SEND|TO|RECEIVE|TRY|CATCH|THROW|WAIT|AND|OR|NOT|DO|WITH|LOG|SAVE|READ|WRITE|RUN|NEW|CLASS|EACH|POST|PUT|PATCH|DELETE|OPTIONS|SELECT|INSERT|INTO|UPDATE|WHERE|VALUES|INNER JOIN|LEFT JOIN|JOIN|ORDER BY|GROUP BY|DESC|COUNT|BEGIN|COMMIT|ROLLBACK|CREATE|TABLE|INDEX|IMPORT|COMPONENT|WAIT|UNTIL)\b/g;

function hl(line){
  const cm=line.match(/(^|\s)\/\//);
  const i=cm?cm.index+cm[1].length:-1;
  const code=i>=0?line.slice(0,i):line;
  const com=i>=0?line.slice(i):'';
  const out=code.split(/("[^"]*")/).map((p,k)=>k%2?'<span class="s">'+esc(p)+'</span>':esc(p).replace(KW,'<span class="k">$1</span>')).join('');
  return out+(com?'<span class="c">'+esc(com)+'</span>':'');
}

function renderHome(){
  const n=doneCount();
  const nx=nextTodo();
  const openMod=nx?nx.m.no:null;
  const mods=MODULES.map(m=>{
    const d=m.terms.filter(isDone).length;
    const rows=m.terms.map(t=>`<button type="button" class="row" data-go="terim-${t.no}"><span class="n">${t.no}</span><span><span class="nm">${esc(t.tr)}</span><span class="en">${esc(t.en)}</span></span>${isDone(t)?'<span class="chip">Tamamlandı</span>':'<span class="go">'+ARROW+'</span>'}</button>`).join('');
    return `<details class="mod${d===m.terms.length?' full':''}"${m.no===openMod?' open':''}><summary><span><span class="mn">Modül ${m.no} · ${m.terms[0].no}–${m.terms[m.terms.length-1].no}</span><span class="mt" style="display:block">${esc(m.name)}</span></span><span class="mr">${d}/${m.terms.length}${CHEV}</span><span class="mbar"><i style="width:${Math.round(d/m.terms.length*100)}%"></i></span></summary>${rows}</details>`;
  }).join('');
  const resume=nx
    ?`<div class="card"><div><p class="ct">Kaldığın yer</p><p class="cs">Terim ${nx.no} · ${esc(nx.tr)} (Modül ${nx.m.no} · ${esc(nx.m.name)})</p></div><button type="button" class="btn primary" data-go="terim-${nx.no}">Devam et</button></div>`
    :`<div class="card"><div><p class="ct">Hepsi tamam</p><p class="cs">${TOTAL} terimin hepsini bitirdin. Karışık tekrarla taze tut.</p></div></div>`;
  const review=n>0
    ?`<div class="card"><div><p class="ct">Karışık tekrar</p><p class="cs">Tamamladığın ${n} terimden karışık 8 soru. Şıklar her seferinde yer değiştirir.</p></div><button type="button" class="btn" data-go="tekrar">Tekrara başla</button></div>`
    :`<div class="card"><div><p class="ct">Karışık tekrar</p><p class="cs">İlk terimi tamamladığında açılır.</p></div></div>`;
  app.innerHTML=`
    <p class="eyebrow">${MODULES.length} modül · ${TOTAL} terim · ${n} tamamlandı</p>
    <h1>Yazılım Terim Defteri</h1>
    <p class="lead">Her terim tek cümlelik bir tanım, akılda kalsın notu, pseudo code ile akış ve 3 soruluk testten oluşur. Üç soruyu da doğru bulduğunda terim tamamlanmış sayılır.</p>
    <div class="bar" role="progressbar" aria-label="Toplam ilerleme" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${n}"><i style="width:${Math.round(n/TOTAL*100)}%"></i></div>
    <div class="cards">${resume}${review}</div>
    <section class="mods" aria-label="Modüller">${mods}</section>`;
}

function buildQuiz(el,qs,onDone,showTag){
  let solved=0,first=0;
  const total=qs.length;
  const scoreEl=document.getElementById('score');
  if(scoreEl)scoreEl.textContent='0 / '+total;
  el.innerHTML='';
  qs.forEach((q,qi)=>{
    const wrap=document.createElement('div');
    wrap.className='q';
    wrap.innerHTML=`${showTag?`<p class="tag">Terim ${q.no} · ${esc(q.term)}</p>`:''}<p class="qt">${qi+1}. ${esc(q.t)}</p><div class="opts"></div><p class="exp" hidden></p>`;
    const box=wrap.querySelector('.opts');
    const exp=wrap.querySelector('.exp');
    let locked=false,missed=false;
    shuffle(q.o.map((_,i)=>i)).forEach((oi,pos)=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='opt';
      b.innerHTML=`<span class="l">${'abcd'[pos]})</span><span class="tx">${esc(q.o[oi])}</span><span class="mk"></span>`;
      b.addEventListener('click',()=>{
        if(locked)return;
        if(oi===0){
          locked=true;
          b.classList.add('right');
          b.querySelector('.mk').innerHTML=ICON_OK;
          wrap.classList.add('solved');
          exp.innerHTML='<b>Neden:</b> '+esc(q.e);
          exp.hidden=false;
          solved++;
          if(!missed)first++;
          if(scoreEl)scoreEl.textContent=solved+' / '+total;
          say('Doğru.');
          if(solved===total)onDone(first,total);
        }else{
          missed=true;
          if(!b.classList.contains('wrong')){b.classList.add('wrong');b.querySelector('.mk').innerHTML=ICON_BAD;}
          b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
          say('Yanlış, başka bir şık dene.');
        }
      });
      box.appendChild(b);
    });
    el.appendChild(wrap);
  });
}

function renderTerm(t){
  const prev=byNo(t.no-1),next=byNo(t.no+1);
  app.innerHTML=`
    <button type="button" class="back" data-go="">‹ Modüller</button>
    <p class="eyebrow">Modül ${t.m.no} · ${esc(t.m.name)} · Terim ${t.no}/${TOTAL}</p>
    <h1>${esc(t.tr)}</h1>
    <p class="eyebrow" style="margin-top:8px">${esc(t.en)}</p>
    <section class="def">
      <p class="lbl">Tanım</p>
      <p class="big">${esc(t.def)}</p>
      <p class="analogy"><b>Akılda kalsın.</b> ${esc(t.an)}</p>
    </section>
    <section class="sec">
      <h2>Akış</h2>
      <p>${esc(t.fi)}</p>
      <pre class="code" aria-label="Pseudo code">${t.code.map(hl).join('\n')}</pre>
      <p class="note">${esc(t.note)}</p>
    </section>
    <section class="sec" id="test">
      <div class="testhead"><h2>Test</h2><span class="score" id="score"></span></div>
      <p class="hint">Yanlış şık kırmızı, doğru şık yeşil yanar. Doğruyu bulana kadar deneyebilirsin.</p>
      <div id="quiz"></div>
      <div id="done"></div>
    </section>
    <nav class="pager" aria-label="Terimler arası geçiş">
      ${prev?`<button type="button" data-go="terim-${prev.no}">‹ ${prev.no}. ${esc(prev.tr)}</button>`:''}
      ${next?`<button type="button" data-go="terim-${next.no}">${next.no}. ${esc(next.tr)} ›</button>`:''}
    </nav>`;
  buildQuiz(document.getElementById('quiz'),t.qs,(first,total)=>{
    state.done[t.no]=true;save();
    const modDone=t.m.terms.every(isDone);
    const nextBtn=next?`<button type="button" class="btn primary" data-go="terim-${next.no}">Sonraki terim: ${esc(next.tr)}</button>`:'';
    const extra=modDone?` Modül ${t.m.no} (${esc(t.m.name)}) tamamlandı.`:'';
    document.getElementById('done').innerHTML=`<div class="donebox" role="status"><p class="dt">${total}/${total} tamamlandı</p><p class="ds">İlk denemede doğru: ${first}/${total}.${extra}</p><div class="actions">${nextBtn}<button type="button" class="btn" data-go="">Modüllere dön</button><button type="button" class="btn" data-retry>Testi yeniden çöz</button></div></div>`;
  },false);
}

function renderReview(){
  const pool=shuffle(TERMS.filter(isDone).flatMap(t=>t.qs.map(q=>Object.assign({},q,{no:t.no,term:t.tr}))));
  const qs=pool.slice(0,8);
  app.innerHTML=`
    <button type="button" class="back" data-go="">‹ Modüller</button>
    <p class="eyebrow">Tamamlanan terimlerden · ${qs.length} soru</p>
    <h1>Karışık tekrar</h1>
    <p class="lead">Sorular ve şıklar her seferinde yer değiştirir. Cevabı şıkkın yerinden değil, anlamından bul.</p>
    <section class="sec">
      <div class="testhead"><h2>Sorular</h2><span class="score" id="score"></span></div>
      <div id="quiz"></div>
      <div id="done"></div>
    </section>`;
  buildQuiz(document.getElementById('quiz'),qs,(first,total)=>{
    document.getElementById('done').innerHTML=`<div class="donebox" role="status"><p class="dt">${total}/${total} tamamlandı</p><p class="ds">İlk denemede doğru: ${first}/${total}.</p><div class="actions"><button type="button" class="btn primary" data-reshuffle>Yeniden karıştır</button><button type="button" class="btn" data-go="">Modüllere dön</button></div></div>`;
  },true);
}

function route(){
  const h=location.hash.slice(1);
  let t=null;
  if(h.indexOf('terim-')===0)t=byNo(parseInt(h.slice(6),10));
  if(t)renderTerm(t);
  else if(h==='tekrar'&&doneCount()>0)renderReview();
  else renderHome();
  window.scrollTo(0,0);
}
function go(h){
  if(location.hash.slice(1)===h)route();
  else location.hash=h;
}

app.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.dataset.go);return;}
  if(e.target.closest('[data-reshuffle]')){renderReview();window.scrollTo(0,0);return;}
  if(e.target.closest('[data-retry]')){
    const t=byNo(parseInt(location.hash.slice(7),10));
    if(t){renderTerm(t);const s=document.getElementById('test');if(s)s.scrollIntoView();}
  }
});
window.addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
