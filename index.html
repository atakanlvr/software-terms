<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Terim Defteri">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Yazılım Terim Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single study column for iPad portrait; term page reads definition → flow → test top to bottom */
:root{
  --bg:#EDF0F5; --card:#FFFFFF; --ink:#172033; --muted:#5A6479; --line:#D6DCE6;
  --accent:#2B46C2; --accent-soft:#E2E7FA; --on-accent:#FFFFFF;
  --code-bg:#F5F7FB; --str:#8A4A00;
  --ok:#1C7347; --ok-bg:#E1F3E8; --ok-line:#86C8A2;
  --bad:#B02A20; --bad-bg:#FBE5E2; --bad-line:#E9A099;
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161F; --card:#19202D; --ink:#E6EAF2; --muted:#9AA3B6; --line:#2B3446;
  --accent:#93A6FF; --accent-soft:#232D4F; --on-accent:#0E1430;
  --code-bg:#141A25; --str:#F0B46A;
  --ok:#7DD3A2; --ok-bg:#15301F; --ok-line:#2E6A47;
  --bad:#FF9B92; --bad-bg:#371B1A; --bad-line:#7A3530;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161F; --card:#19202D; --ink:#E6EAF2; --muted:#9AA3B6; --line:#2B3446;
  --accent:#93A6FF; --accent-soft:#232D4F; --on-accent:#0E1430;
  --code-bg:#141A25; --str:#F0B46A;
  --ok:#7DD3A2; --ok-bg:#15301F; --ok-line:#2E6A47;
  --bad:#FF9B92; --bad-bg:#371B1A; --bad-line:#7A3530;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:800px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,50px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;margin:0}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.02em}
.lead{color:var(--muted);margin-top:12px;max-width:62ch}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:20px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.list{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;min-height:64px}
.row:first-child{border-top:0}
button.row{cursor:pointer}
.row .n{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .nm{display:block;font-weight:600;font-size:18px;line-height:1.3}
.row .en{display:block;font-size:14px;color:var(--muted)}
.row.soon .nm{color:var(--muted);font-weight:500}
.chip{font-size:13px;line-height:1;padding:7px 11px;border-radius:99px;white-space:nowrap;font-weight:500}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.ready{background:var(--accent-soft);color:var(--accent)}
.chip.soon{color:var(--muted);border:1px solid var(--line)}
.review{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.review>div{min-width:0;flex:1 1 260px}
.rt{font-weight:600;font-size:18px}
.rs{color:var(--muted);font-size:15px;margin-top:2px}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.back{background:none;border:0;padding:8px 0;min-height:44px;color:var(--accent);font:500 16px var(--f-body);cursor:pointer;margin-bottom:10px}
.def{margin-top:22px;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.lbl{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-bottom:8px}
.big{font-size:clamp(20px,2.8vw,25px);line-height:1.45;font-weight:500;text-wrap:pretty}
.analogy{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted)}
.analogy b{color:var(--ink);font-weight:600}
.sec{margin-top:36px}
.sec>p{margin-top:8px}
.code{margin:14px 0 0;padding:16px 18px;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;overflow-x:auto;font-family:var(--f-mono);font-size:14.5px;line-height:1.8;white-space:pre;color:var(--ink)}
.code .k{color:var(--accent);font-weight:500}
.code .s{color:var(--str)}
.code .c{color:var(--muted);font-style:italic}
.note{margin-top:14px;color:var(--muted)}
.testhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.score{font-family:var(--f-mono);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:15px}
.q{padding:22px 0 4px}
.q+.q{border-top:1px solid var(--line);margin-top:14px}
.tag{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);margin-bottom:6px}
.qt{font-weight:600;font-size:18px;line-height:1.45;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) 20px;align-items:start;gap:12px;width:100%;min-height:56px;padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:400 17px/1.45 var(--f-body);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt .l{font-family:var(--f-mono);font-size:15px;color:var(--muted);padding-top:1px}
.opt .mk{display:flex;align-items:center;height:24px}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.right{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:500}
.opt.wrong .l{color:var(--bad)} .opt.right .l{color:var(--ok)}
.q.solved .opt:not(.right):not(.wrong){color:var(--muted);cursor:default}
@media (hover:hover){.q:not(.solved) .opt:not(.wrong):hover{border-color:var(--accent)}}
.opt.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.exp{margin-top:12px;color:var(--muted)}
.exp b{color:var(--ink);font-weight:600}
.donebox{margin-top:24px;padding:20px;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:14px;color:var(--ok)}
.dt{font-family:var(--f-display);font-weight:700;font-size:24px}
.ds{margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.opt.shake{animation:none}}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<main id="app" class="wrap" lang="tr">
  <p class="eyebrow">İlk 10 terim</p>
  <h1>Yazılım Terim Defteri</h1>
</main>
<p id="live" class="sr" aria-live="polite"></p>

<script>
const KEY='terim-defteri-v1';
const TERMS=[
{no:1,tr:'Yazılım',en:'Software',ready:true,
 def:'Yazılım, bilgisayara bir işi nasıl yapacağını adım adım söyleyen talimatlar bütünüdür.',
 analogy:'Donanım piyano ise yazılım notadır. Piyano tek başına çalmaz; nota değişince aynı piyano başka şarkı çalar.',
 flowIntro:'Basit bir giriş ekranının arkasındaki talimatlar:',
 code:[
  'START',
  '  GET şifre FROM kullanıcı            // girdi: dışarıdan bilgi alır',
  '  IF şifre == kayıtlı_şifre THEN      // karar: talimata göre kontrol eder',
  '      SHOW "Giriş başarılı"           // çıktı: sonucu gösterir',
  '  ELSE',
  '      SHOW "Hatalı şifre"             // çıktı: alternatif sonuç',
  '  END IF',
  'END'],
 note:'Bilgisayar bu satırları kendi kafasına göre değil, yazıldığı sırayla ve yazıldığı gibi uygular. Yazılım tam olarak budur.',
 qs:[
  {t:'Aşağıdakilerden hangisi yazılımdır?',o:["Laptop'un şarj aleti",'Telefonun kamera lensi','Telefonun kamera uygulaması','Router cihazı'],c:2,
   e:'Lens fiziksel parça, yani donanım. Uygulama ise lense ne zaman fotoğraf çekeceğini söyleyen talimatlar, yani yazılım.'},
  {t:'Aynı bilgisayarda hem Chrome hem Excel çalışabiliyor. Bu ne anlama gelir?',o:['Chrome ve Excel aslında aynı yazılımdır','Aynı donanım, farklı talimatlarla farklı işler yapabilir','Her yazılım için ayrı bir bilgisayar gerekir','Yazılım fabrikada donanımın içine sabitlenir'],c:1,
   e:'Piyano aynı, nota farklı. Bilgisayar değişmiyor, ona verilen talimatlar değişiyor.'},
  {t:'Teknik bilgisi olmayan birine yazılımı en doğru hangi cümle anlatır?',o:['Bilgisayarın içindeki elektronik parçalardır','İnternete bağlanmayı sağlayan sistemdir','Bilgisayara ne yapacağını adım adım söyleyen talimatlardır','Ekranda gördüğümüz renkli görüntülerdir'],c:2,
   e:'Parçalar donanımdır, internet bir bağlantı ortamıdır, ekran görüntüsü ise sadece çıktıdır. Yazılım talimatın kendisidir.'}
 ]},
{no:2,tr:'Donanım',en:'Hardware'},
{no:3,tr:'Girdi / Çıktı',en:'Input / Output'},
{no:4,tr:'Algoritma',en:'Algorithm'},
{no:5,tr:'Kaynak Kod',en:'Source Code'},
{no:6,tr:'Programlama Dili',en:'Programming Language'},
{no:7,tr:'Derleyici / Yorumlayıcı',en:'Compiler / Interpreter'},
{no:8,tr:'Veri ve Veri Tipi',en:'Data and Data Type'},
{no:9,tr:'Değişken',en:'Variable'},
{no:10,tr:'Koşul',en:'Condition · IF / ELSE'}
];

let state={done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)state=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const app=document.getElementById('app');
const live=document.getElementById('live');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const say=m=>{live.textContent='';setTimeout(()=>{live.textContent=m;},40);};
const doneCount=()=>TERMS.filter(t=>t.ready&&state.done[t.no]).length;
const ICON_OK='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="sr">Doğru</span>';
const ICON_BAD='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg><span class="sr">Yanlış</span>';

function hl(line){
  const i=line.indexOf('//');
  const code=i>=0?line.slice(0,i):line;
  const com=i>=0?line.slice(i):'';
  const out=code.split(/("[^"]*")/).map((p,k)=>k%2
    ?'<span class="s">'+esc(p)+'</span>'
    :esc(p).replace(/\b(START|END IF|END|IF|THEN|ELSE|GET|FROM|SHOW)\b/g,'<span class="k">$1</span>')).join('');
  return out+(com?'<span class="c">'+esc(com)+'</span>':'');
}

function renderHome(){
  const n=doneCount();
  const pct=Math.round(n/TERMS.length*100);
  const rows=TERMS.map(t=>{
    const done=!!state.done[t.no];
    const st=done?'<span class="chip ok">Tamamlandı</span>':t.ready?'<span class="chip ready">Hazır</span>':'<span class="chip soon">Sırada</span>';
    const inner=`<span class="n">${String(t.no).padStart(2,'0')}</span><span><span class="nm">${esc(t.tr)}</span><span class="en">${esc(t.en)}</span></span>${st}`;
    return t.ready?`<button type="button" class="row" data-go="terim-${t.no}">${inner}</button>`:`<div class="row soon">${inner}</div>`;
  }).join('');
  const review=n>0
    ?`<section class="review"><div><p class="rt">Karışık tekrar</p><p class="rs">Tamamladığın terimlerden karışık sorular. Şıklar her seferinde yer değiştirir.</p></div><button type="button" class="btn primary" data-go="tekrar">Tekrara başla</button></section>`
    :`<section class="review"><div><p class="rt">Karışık tekrar</p><p class="rs">İlk terimi tamamladığında açılır.</p></div></section>`;
  app.innerHTML=`
    <p class="eyebrow">İlk 10 terim · ${n}/${TERMS.length} tamamlandı</p>
    <h1>Yazılım Terim Defteri</h1>
    <p class="lead">Her terim tek cümlelik bir tanım, pseudo code ile akış ve 3 soruluk testten oluşur. Üç soruyu da doğru bulduğunda terim tamamlanmış sayılır.</p>
    <div class="bar" role="progressbar" aria-label="İlerleme" aria-valuemin="0" aria-valuemax="${TERMS.length}" aria-valuenow="${n}"><i style="width:${pct}%"></i></div>
    <section class="list" aria-label="Terimler">${rows}</section>
    ${review}`;
}

function buildQuiz(el,qs,onDone,showTag){
  let solved=0,first=0;
  const total=qs.length;
  const scoreEl=document.getElementById('score');
  if(scoreEl)scoreEl.textContent='0 / '+total;
  el.innerHTML='';
  qs.forEach((q,qi)=>{
    const wrap=document.createElement('div');
    wrap.className='q';
    wrap.innerHTML=`${showTag?`<p class="tag">Terim ${q.no} · ${esc(q.term)}</p>`:''}<p class="qt">${qi+1}. ${esc(q.t)}</p><div class="opts"></div><p class="exp" hidden></p>`;
    const box=wrap.querySelector('.opts');
    const exp=wrap.querySelector('.exp');
    let locked=false,missed=false;
    shuffle(q.o.map((_,i)=>i)).forEach((oi,pos)=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='opt';
      b.innerHTML=`<span class="l">${'abcd'[pos]})</span><span class="tx">${esc(q.o[oi])}</span><span class="mk" aria-hidden="false"></span>`;
      b.addEventListener('click',()=>{
        if(locked)return;
        if(oi===q.c){
          locked=true;
          b.classList.add('right');
          b.querySelector('.mk').innerHTML=ICON_OK;
          wrap.classList.add('solved');
          exp.innerHTML='<b>Neden:</b> '+esc(q.e);
          exp.hidden=false;
          solved++;
          if(!missed)first++;
          if(scoreEl)scoreEl.textContent=solved+' / '+total;
          say('Doğru.');
          if(solved===total)onDone(first,total);
        }else{
          missed=true;
          if(!b.classList.contains('wrong')){
            b.classList.add('wrong');
            b.querySelector('.mk').innerHTML=ICON_BAD;
          }
          b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
          say('Yanlış, başka bir şık dene.');
        }
      });
      box.appendChild(b);
    });
    el.appendChild(wrap);
  });
}

function renderTerm(t){
  app.innerHTML=`
    <button type="button" class="back" data-go="">‹ Terimler</button>
    <p class="eyebrow">Terim ${t.no} / ${TERMS.length} · ${esc(t.en)}</p>
    <h1>${esc(t.tr)}</h1>
    <section class="def">
      <p class="lbl">Tanım</p>
      <p class="big">${esc(t.def)}</p>
      <p class="analogy"><b>Akılda kalsın.</b> ${esc(t.analogy)}</p>
    </section>
    <section class="sec">
      <h2>Akış</h2>
      <p>${esc(t.flowIntro)}</p>
      <pre class="code" aria-label="Pseudo code">${t.code.map(hl).join('\n')}</pre>
      <p class="note">${esc(t.note)}</p>
    </section>
    <section class="sec" id="test">
      <div class="testhead"><h2>Test</h2><span class="score" id="score"></span></div>
      <p class="hint">Yanlış şık kırmızı, doğru şık yeşil yanar. Doğruyu bulana kadar deneyebilirsin.</p>
      <div id="quiz"></div>
      <div id="done"></div>
    </section>`;
  buildQuiz(document.getElementById('quiz'),t.qs,(first,total)=>{
    state.done[t.no]=true;save();
    const nx=TERMS.find(x=>x.no===t.no+1);
    const nextBtn=nx&&nx.ready?`<button type="button" class="btn primary" data-go="terim-${nx.no}">Sonraki terim: ${esc(nx.tr)}</button>`:'';
    const later=nx&&!nx.ready?` Sıradaki terim (${esc(nx.tr)}) bir sonraki derste eklenecek.`:'';
    document.getElementById('done').innerHTML=`<div class="donebox" role="status"><p class="dt">${total}/${total} tamamlandı</p><p class="ds">İlk denemede doğru: ${first}/${total}.${later}</p><div class="actions">${nextBtn}<button type="button" class="btn" data-go="">Terimlere dön</button><button type="button" class="btn" data-retry>Testi yeniden çöz</button></div></div>`;
  },false);
}

function renderReview(){
  const pool=shuffle(TERMS.filter(t=>t.ready&&state.done[t.no]).flatMap(t=>t.qs.map(q=>Object.assign({},q,{no:t.no,term:t.tr}))));
  const qs=pool.slice(0,6);
  app.innerHTML=`
    <button type="button" class="back" data-go="">‹ Terimler</button>
    <p class="eyebrow">Tamamlanan terimlerden · ${qs.length} soru</p>
    <h1>Karışık tekrar</h1>
    <p class="lead">Sorular ve şıklar her seferinde yer değiştirir. Cevabı şıkkın yerinden değil, anlamından bul.</p>
    <section class="sec">
      <div class="testhead"><h2>Sorular</h2><span class="score" id="score"></span></div>
      <div id="quiz"></div>
      <div id="done"></div>
    </section>`;
  buildQuiz(document.getElementById('quiz'),qs,(first,total)=>{
    document.getElementById('done').innerHTML=`<div class="donebox" role="status"><p class="dt">${total}/${total} tamamlandı</p><p class="ds">İlk denemede doğru: ${first}/${total}.</p><div class="actions"><button type="button" class="btn primary" data-reshuffle>Yeniden karıştır</button><button type="button" class="btn" data-go="">Terimlere dön</button></div></div>`;
  },true);
}

function route(){
  const h=location.hash.slice(1);
  let t=null;
  if(h.indexOf('terim-')===0)t=TERMS.find(x=>'terim-'+x.no===h&&x.ready);
  if(t)renderTerm(t);
  else if(h==='tekrar'&&doneCount()>0)renderReview();
  else renderHome();
  window.scrollTo(0,0);
}
function go(h){
  if(location.hash.slice(1)===h)route();
  else location.hash=h;
}

app.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){go(g.dataset.go);return;}
  if(e.target.closest('[data-reshuffle]')){renderReview();window.scrollTo(0,0);return;}
  if(e.target.closest('[data-retry]')){
    const t=TERMS.find(x=>'terim-'+x.no===location.hash.slice(1));
    if(t){renderTerm(t);const s=document.getElementById('test');if(s)s.scrollIntoView();}
  }
});
window.addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
